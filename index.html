<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freelance Ledger — finance tools for freelancers</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>Freelance Ledger</h1><p>Honest picks for invoicing, books, tax, payments, banking & runway.</p></header>
<main><nav id="filters"></nav><section id="grid"></section>
<section class="calcs"><div class="calc"><h2>Runway</h2><label>Cash on hand $<input id="cash" type="number" min="0" value="20000"></label><label>Monthly burn $<input id="burn" type="number" min="0" value="4000"></label><p id="runOut"></p></div>
<div class="calc"><h2>Quarterly tax set-aside</h2><label>Quarter income $<input id="inc" type="number" min="0" value="25000"></label><label>Est. total rate %<input id="rate" type="number" min="0" value="28"></label><p id="taxOut"></p><small>Estimate only, not tax advice.</small></div></section>
<section class="news"><h2>Newsletter</h2><form onsubmit="event.preventDefault();this.querySelector('p').textContent='Coming soon — signup not active yet.'"><input type="email" placeholder="you@example.com" required><button>Subscribe</button><p></p></form></section></main>
<footer>Pricing as of Oct 2026; check vendor sites. No affiliate links.</footer>
<script src="tools.js"></script><script src="app.js"></script></body></html>
